<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DCTFWeb{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='basecoat.cdn.min.css') }}">
<script src="{{ url_for('static', filename='basecoat.all.min.js') }}" defer></script>
<style>
  @font-face { font-family:'InterVar'; src:url("{{ url_for('static', filename='fonts/inter-400.woff2') }}") format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'InterVar'; src:url("{{ url_for('static', filename='fonts/inter-500.woff2') }}") format('woff2'); font-weight:500; font-display:swap; }
  @font-face { font-family:'InterVar'; src:url("{{ url_for('static', filename='fonts/inter-600.woff2') }}") format('woff2'); font-weight:600; font-display:swap; }
  @font-face { font-family:'InterVar'; src:url("{{ url_for('static', filename='fonts/inter-700.woff2') }}") format('woff2'); font-weight:700; font-display:swap; }

  :root {
    --primary:#14213d; --primary-foreground:#ffffff;
    --background:#f5f6f8; --card:#ffffff;
    --foreground:#0f172a; --muted:#f1f3f5; --muted-foreground:#697586;
    --border:#e6e8ec; --input:#e6e8ec; --ring:#14213d;
    --radius:.625rem;
    --ok:#15803d;    --ok-bg:#e7f7ec;    --ok-bd:#b7e4c4;
    --info:#1d4ed8;  --info-bg:#e6effe;  --info-bd:#bcd4fb;
    --warn:#b45309;  --warn-bg:#fdf3e2;  --warn-bd:#f3d9a8;
    --neutral:#475569;--neutral-bg:#eef1f4;--neutral-bd:#dbe1e8;
    --danger:#b91c1c;--danger-bg:#fdeaea;--danger-bd:#f6c6c6;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md:0 6px 20px rgba(15,23,42,.09);
    --shadow-top:0 -4px 16px rgba(15,23,42,.06);
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'InterVar', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--background); color:var(--foreground);
    margin:0; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  a { color:var(--primary); }

  /* ---------- header ---------- */
  .app-header { background:var(--card); border-bottom:1px solid var(--border); }
  .app-header__inner { max-width:1060px; margin:0 auto; padding:15px 22px; display:flex; align-items:center; gap:13px; }
  .app-mark { width:38px; height:38px; border-radius:10px; background:var(--primary); color:#fff;
              display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow-sm); }
  .app-mark svg { width:20px; height:20px; }
  .app-titles h1 { margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.006em; }
  .app-titles p  { margin:2px 0 0; font-size:12.5px; color:var(--muted-foreground); }

  /* ---------- layout ---------- */
  .container { max-width:1060px; margin:24px auto; padding:0 22px 140px; }
  .stack > * + * { margin-top:16px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); }
  .card__header { padding:16px 20px 13px; border-bottom:1px solid var(--border); }
  .card__title { margin:0; font-size:14.5px; font-weight:600; letter-spacing:-.006em; display:flex; align-items:center; gap:8px; }
  .card__title .n { color:var(--muted-foreground); font-weight:500; }
  .card__desc  { margin:4px 0 0; font-size:12.5px; color:var(--muted-foreground); }
  .card__body  { padding:14px 20px 18px; }

  /* ---------- tabs (shadcn segmented) ---------- */
  .tabs { display:flex; flex-direction:column; gap:14px; }
  .tabs > nav[role="tablist"] {
    display:inline-flex; align-items:center; gap:2px; width:fit-content;
    background:var(--muted); border-radius:9px; padding:3px;
  }
  .tabs > nav[role="tablist"] > [role="tab"] {
    appearance:none; border:0; background:transparent; cursor:pointer;
    font:inherit; font-size:13px; font-weight:500; color:var(--muted-foreground);
    padding:5px 13px; border-radius:7px; transition:background .15s, color .15s, box-shadow .15s;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .tabs > nav[role="tablist"] > [role="tab"]:hover { color:var(--foreground); }
  .tabs > nav[role="tablist"] > [role="tab"][aria-selected="true"] {
    background:var(--card); color:var(--foreground); box-shadow:var(--shadow-sm);
  }
  .tabs > [role="tabpanel"]:focus { outline:none; }
  .tabs > [role="tabpanel"][hidden] { display:none; }

  /* ---------- toolbar above table ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .search {
    position:relative; flex:1; min-width:200px; max-width:340px;
  }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted-foreground); pointer-events:none; }
  .search input {
    width:100%; height:34px; padding:0 10px 0 31px; font:inherit; font-size:13px;
    border:1px solid var(--input); border-radius:8px; background:var(--card); color:var(--foreground);
    transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus { outline:none; border-color:var(--ring); box-shadow:0 0 0 3px rgba(20,33,61,.12); }
  .ghost-btn {
    appearance:none; border:1px solid var(--input); background:var(--card); cursor:pointer;
    font:inherit; font-size:12.5px; font-weight:500; color:var(--foreground);
    height:34px; padding:0 11px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
    transition:background .15s, border-color .15s;
  }
  .ghost-btn:hover { background:var(--muted); }
  .ghost-btn svg { width:14px; height:14px; color:var(--muted-foreground); }

  /* ---------- table ---------- */
  .table-wrap { border:1px solid var(--border); border-radius:11px; overflow:hidden; }
  .table-scroll { max-height:60vh; overflow:auto; }
  table.grid { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  table.grid thead th {
    position:sticky; top:0; z-index:1; background:var(--muted);
    text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted-foreground); padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  table.grid tbody td { padding:9px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.grid tbody tr:last-child td { border-bottom:0; }
  table.grid tbody tr:hover { background:#fafbfc; }
  table.grid tbody tr.hidden-row { display:none; }
  td.col-check, th.col-check { width:38px; padding-left:16px; padding-right:0; }
  .mono { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; color:var(--muted-foreground); font-size:12.5px; }
  .cell-name { font-weight:500; color:var(--foreground); }
  .cell-sigla { color:var(--muted-foreground); font-size:12px; font-weight:500; }
  .dash { color:var(--muted-foreground); }

  /* ---------- checkbox ---------- */
  input[type="checkbox"].cb {
    appearance:none; -webkit-appearance:none; margin:0; cursor:pointer; flex-shrink:0;
    width:16px; height:16px; border:1.5px solid #c4cbd4; border-radius:5px; background:var(--card);
    display:inline-grid; place-content:center; transition:background .12s, border-color .12s;
    vertical-align:middle;
  }
  input[type="checkbox"].cb::after {
    content:""; width:9px; height:9px; transform:scale(0);
    background:var(--primary-foreground); transition:transform .12s;
    clip-path:polygon(14% 47%, 0 60%, 40% 100%, 100% 22%, 86% 8%, 38% 66%);
  }
  input[type="checkbox"].cb:checked { background:var(--primary); border-color:var(--primary); }
  input[type="checkbox"].cb:checked::after { transform:scale(1); }
  input[type="checkbox"].cb:disabled { opacity:.45; cursor:not-allowed; }
  input[type="checkbox"].cb:focus-visible { outline:none; box-shadow:0 0 0 3px rgba(20,33,61,.18); }

  /* ---------- status pills ---------- */
  .pill {
    display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 8px; border-radius:999px;
    font-size:11.5px; font-weight:500; line-height:1.6; white-space:nowrap; border:1px solid transparent;
  }
  .pill::before { content:""; width:6px; height:6px; border-radius:999px; background:currentColor; opacity:.9; }
  .pill--ok,        .pill--finalizado          { color:var(--ok);      background:var(--ok-bg);      border-color:var(--ok-bd); }
  .pill--info,      .pill--anexado-no-portal    { color:var(--info);    background:var(--info-bg);    border-color:var(--info-bd); }
  .pill--warn,      .pill--documentos-gerados   { color:var(--warn);    background:var(--warn-bg);    border-color:var(--warn-bd); }
  .pill--neutral,   .pill--tarefa-criada        { color:var(--neutral); background:var(--neutral-bg); border-color:var(--neutral-bd); }
  .pill--danger,    .pill--erro,    .pill--incompleta { color:var(--danger); background:var(--danger-bg); border-color:var(--danger-bd); }
  .pill--completa { color:var(--ok); background:var(--ok-bg); border-color:var(--ok-bd); }

  /* ---------- primary / outline buttons ---------- */
  .btn-primary {
    appearance:none; border:0; cursor:pointer; font:inherit; font-size:13px; font-weight:600;
    background:var(--primary); color:var(--primary-foreground);
    height:38px; padding:0 18px; border-radius:9px; display:inline-flex; align-items:center; gap:8px;
    box-shadow:var(--shadow-sm); transition:filter .15s, transform .05s;
  }
  .btn-primary:hover { filter:brightness(1.14); }
  .btn-primary:active { transform:translateY(1px); }
  .btn-primary:disabled { opacity:.55; cursor:wait; filter:none; }
  .btn-primary svg { width:15px; height:15px; }
  .btn-outline {
    appearance:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:500;
    background:var(--card); color:var(--foreground); border:1px solid var(--input);
    height:34px; padding:0 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
    transition:background .15s;
  }
  .btn-outline:hover { background:var(--muted); }
  .btn-outline svg { width:14px; height:14px; color:var(--muted-foreground); }

  /* ---------- footer action bar ---------- */
  .actionbar {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--card); border-top:1px solid var(--border); box-shadow:var(--shadow-top);
  }
  .actionbar__inner {
    max-width:1060px; margin:0 auto; padding:12px 22px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .field-inline { display:flex; flex-direction:column; gap:3px; }
  .field-inline label { font-size:11px; font-weight:500; color:var(--muted-foreground); }
  .field-inline input {
    height:34px; width:120px; padding:0 10px; font:inherit; font-size:13px;
    border:1px solid var(--input); border-radius:8px; background:var(--card); color:var(--foreground);
  }
  .field-inline input:focus { outline:none; border-color:var(--ring); box-shadow:0 0 0 3px rgba(20,33,61,.12); }
  .opt-group { display:flex; gap:14px; padding-left:16px; border-left:1px solid var(--border); }
  .opt { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--foreground); cursor:pointer; }
  .opt input:disabled + span { color:var(--muted-foreground); }
  .spacer { margin-left:auto; }
  .selcount { font-size:12.5px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }

  /* ---------- alert ---------- */
  .note {
    display:flex; gap:11px; padding:13px 15px; border-radius:11px; font-size:13px;
    border:1px solid var(--warn-bd); background:var(--warn-bg); color:#7a4b0c;
  }
  .note svg { width:17px; height:17px; flex-shrink:0; margin-top:1px; color:var(--warn); }
  .note.note--danger { border-color:var(--danger-bd); background:var(--danger-bg); color:#8f1d1d; }
  .note.note--danger svg { color:var(--danger); }

  /* ---------- empty state ---------- */
  .empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:44px 20px; text-align:center; }
  .empty svg { width:30px; height:30px; color:var(--muted-foreground); opacity:.6; }
  .empty p { margin:0; font-size:13px; color:var(--muted-foreground); max-width:360px; }

  /* ---------- progress page ---------- */
  .prog-head { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--foreground); }
  .prog-track { height:8px; border-radius:999px; background:var(--muted); overflow:hidden; margin:12px 0 20px; }
  .prog-fill  { height:100%; width:0; background:var(--primary); border-radius:999px; transition:width .35s ease; }
  .spinner { width:15px; height:15px; border:2px solid var(--border); border-top-color:var(--primary);
             border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .summary { margin-top:18px; padding:15px 17px; border-radius:12px; border:1px solid var(--border); font-size:13px; }
  .summary--ok   { background:var(--ok-bg);   border-color:var(--ok-bd);   color:#14532d; }
  .summary--warn { background:var(--warn-bg); border-color:var(--warn-bd); color:#7a4b0c; }
  .summary h2 { margin:0 0 6px; font-size:14px; font-weight:600; }
  .summary ul { margin:8px 0 0; padding-left:18px; }
  .summary li { margin:3px 0; }
  .backlink { display:inline-flex; align-items:center; gap:6px; margin-top:20px; font-size:13px; font-weight:500; text-decoration:none; }

  /* ---------- modal de confirmação ---------- */
  .modal-overlay { position:fixed; inset:0; z-index:50; background:rgba(15,23,42,.45);
                   display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:14px;
           box-shadow:var(--shadow-md); max-width:430px; width:100%; padding:20px 22px 18px; }
  .modal h3 { margin:0 0 5px; font-size:15px; font-weight:600; }
  .modal > p { margin:0; font-size:12.5px; color:var(--muted-foreground); }
  .modal .conf-resumo { margin-top:12px; font-size:13.5px; color:var(--foreground); }
  .modal .conf-avisos { margin:12px 0 0; padding:10px 12px 10px 26px; list-style:disc;
                        background:var(--warn-bg); border:1px solid var(--warn-bd);
                        border-radius:9px; font-size:12.5px; color:#7a4b0c; }
  .modal .conf-avisos li { margin:2px 0; }
  .modal__actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header__inner">
    <div class="app-mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
    </div>
    <div class="app-titles">
      <h1>{% block header %}DCTFWeb{% endblock %}</h1>
      <p>{% block subtitle %}{% endblock %}</p>
    </div>
  </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
